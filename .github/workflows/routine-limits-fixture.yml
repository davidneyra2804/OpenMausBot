name: routine limits fixture
on:
  push:
    branches: ["verify/routine-timeout-fixture"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node --experimental-strip-types scripts/verify-routine-limits.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: routine-limits-evidence
          path: /tmp/openmausbot-verification-evidence/*.routine-limits.json
